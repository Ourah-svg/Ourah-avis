<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ourah — Votre avis compte</title>
<style>
:root{--ink:#241a21;--accent:#9a003d;--cream:#faf6f1;--line:#e6dcd6;--soft:#f3e9ee}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55}
header{background:#fff;text-align:center;padding:22px 12px 14px;border-bottom:1px solid var(--line)}header img{width:min(260px,62%);height:auto}
main{max-width:720px;margin:0 auto;padding:18px 16px 80px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:6px 0 4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.small{font-size:.85rem;color:#6b5f66}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px;box-shadow:0 2px 12px rgba(80,20,50,.05)}
h1{font-size:1.55rem;margin:.1em 0 .4em}.q{margin:22px 0 8px;font-weight:600}
.opts{display:grid;gap:8px}.opts.two{grid-template-columns:1fr 1fr}
.opt{display:block;position:relative}.opt input{position:absolute;opacity:0}.opt span{display:block;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;transition:.15s}
.opt span:hover{border-color:var(--accent)}.opt input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}.opt input:focus-visible+span{outline:3px solid #d9a3b8}
.scale{display:flex;gap:6px;flex-wrap:wrap}.scale .opt{flex:1;min-width:42px}.scale .opt span{text-align:center;padding:12px 0}
input[type=number],input[type=email],textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.price{position:relative}.price:after{content:"€";position:absolute;right:14px;top:12px;color:#6b5f66}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
button{font:inherit;border:0;border-radius:999px;padding:13px 26px;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}button.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}button:disabled{opacity:.5}
.err{color:#a0322d;font-size:.92rem;min-height:1.3em;margin-top:8px}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;margin:14px 0;font-size:.93rem}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px}.chk input{margin-top:5px;width:20px;height:20px;flex:none}
.bottles{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}.bottles img{width:23%;height:auto;border-radius:10px}
details{margin-top:12px;font-size:.9rem}summary{cursor:pointer;color:var(--accent);font-weight:600}
@media(max-width:520px){.opts.two{grid-template-columns:1fr}}
</style></head><body>

{id:p+"_note",q:"Note globale (1 = pas du tout aimé, 10 = adoré)",type:"scale10",req:1},
{id:p+"_intensite",q:"Intensité du goût",type:"radio",o:["Trop faible","Bien équilibrée","Trop forte"],req:1},
{id:p+"_sucre",q:"Sucrosité perçue",type:"radio",o:["Trop peu","Juste ce qu’il faut","Trop sucrée"],req:1},
{id:p+"_acid",q:"Acidité et fraîcheur",type:"radio",o:["Trop faible","Bien équilibrée","Trop forte"],req:1},
{id:p+"_arome",q:"Quel arôme ressort le plus ?",type:"radio",two:1,o:p=="day"?["Fleur de sureau","Gingembre","Agrumes","Autre"]:["Cassis","Baie de sureau","Citron","Autre"],req:1},
{id:p+"_rachat",q:"Le rachèteriez-vous s’il était disponible là où vous allez ?",type:"scale",lab:["Certainement pas","Certainement"],req:1},
{id:p+"_comment",q:"Un commentaire ? (facultatif, sans information personnelle)",type:"text"}]}}
function prix(p,n){return{t:"Prix : "+n,intro:"Pour une bouteille de 33 cl, d’après la description. Indiquez un prix en euros pour chaque question, du plus bas au plus élevé.",items:[
{id:p+"_p1",q:"À partir de quel prix serait-elle si bon marché que vous douteriez de sa qualité ?",type:"price",req:1},
{id:p+"_p2",q:"À partir de quel prix serait-ce une bonne affaire ?",type:"price",req:1},
{id:p+"_p3",q:"À partir de quel prix commencerait-elle à être chère, tout en restant envisageable ?",type:"price",req:1},
{id:p+"_p4",q:"À partir de quel prix serait-elle trop chère pour que vous l’achetiez ?",type:"price",req:1}]}}
Q.push({t:"Arômes et saveurs",intro:"Imaginez une boisson sans alcool, fruitée et botanique, à partager. Dites-nous ce qui vous attire.",items:[
{id:"aromes_aimes",q:"Quels arômes vous donnent le plus envie ? (3 maximum)",type:"check",two:1,max:3,o:["Fleur de sureau","Gingembre","Citron / agrumes","Pomme-poire","Fleur d’oranger","Cassis","Baie de sureau","Aucun de ceux-là"],req:1},
{id:"aromes_evites",q:"Lesquels vous attirent le moins ? (facultatif)",type:"check",two:1,o:["Fleur de sureau","Gingembre","Citron / agrumes","Pomme-poire","Fleur d’oranger","Cassis","Baie de sureau","Aucun"]},
{id:"style",q:"Quel style de goût recherchez-vous dans ce type de boisson ?",type:"radio",o:["Frais et léger","Fruité et généreux","Floral et délicat","Profond et un peu acidulé","Je ne sais pas"],req:1},
{id:"sucre_souhaite",q:"Quelle sucrosité préférez-vous ?",type:"radio",two:1,o:["Peu sucrée","Moyennement sucrée","Plutôt sucrée","Je ne sais pas"],req:1},
{id:"day_envie",q:"Day (fleur de sureau, agrumes, gingembre) : à quel point avez-vous envie de l’essayer ?",type:"scale",lab:["Pas du tout","Tout à fait"],req:1},
{id:"night_envie",q:"Night (cassis, baie de sureau) : à quel point avez-vous envie de l’essayer ?",type:"scale",lab:["Pas du tout","Tout à fait"],req:1}]},
{t:"Image de marque",intro:"Les visuels sont provisoires. Dites-nous simplement ce que la marque vous inspire.",items:[
{id:"mots",q:"Quels mots associez-vous le mieux à Ourah ? (3 maximum)",type:"check",two:1,max:3,o:["Festive","Élégante","Naturelle","Conviviale","Premium","Moderne","Ludique","Sérieuse","Ordinaire"],req:1},
{id:"nom_memo",q:"Le nom « Ourah » est-il facile à retenir ?",type:"scale",lab:["Pas du tout","Très facile"],req:1},
{id:"nom_envie",q:"Le nom « Ourah » donne-t-il envie de découvrir la boisson ?",type:"scale",lab:["Pas du tout","Tout à fait"],req:1},
{id:"achat_lieu",q:"Où aimeriez-vous le plus trouver Ourah ? (2 maximum)",type:"check",two:1,max:2,o:["Supermarché","Épicerie fine","Bar / restaurant","Caviste","Magasin bio","Site de la marque","Événements / festivals"],req:1}]});
Q.push(prix("day","Ourah Day"),prix("night","Ourah Night"));
Q.push({t:"Format et lancement",info:1,items:[
{id:"format",q:"Quel format préférez-vous pour un verre à partager ?",type:"radio",o:["25 cl","33 cl","Sans préférence"],req:1},
{id:"contenant",q:"Quel contenant vous semble le plus premium ?",type:"radio",two:1,o:["Verre","Canette","PET","Sans préférence"],req:1},
{id:"prefere",q:"Si vous ne deviez en choisir qu’un ?",type:"radio",two:1,o:["Day","Night","Les deux à égalité","Aucun"],req:1},
{id:"email",q:"Souhaitez-vous être prévenu(e) du lancement ? Laissez votre e-mail (facultatif)",type:"email"},
{id:"consent",type:"consent",text:"J’accepte qu’Ourah utilise mon adresse e-mail uniquement pour m’informer du lancement d’Ourah. Elle sera conservée jusqu’au lancement, séparément de mes réponses, et je peux retirer mon accord à tout moment à raphael.cuvelier@ourah.fr."}]});
Q.push({t:"Merci !",items:[],final:1});
const A={};let s=0;const f=document.getElementById("f");
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function r(it){let h="";if(it.q)h+='<div class="q">'+esc(it.q)+"</div>";
if(it.type=="radio")h+='<div class="opts '+(it.two?"two":"")+'">'+it.o.map(o=>'<label class="opt"><input type="radio" name="'+it.id+'" value="'+esc(o)+'" '+(A[it.id]==o?"checked":"")+'><span>'+esc(o)+"</span></label>").join("")+"</div>";
if(it.type=="check")h+='<div class="opts '+(it.two?"two":"")+'">'+it.o.map(o=>'<label class="opt"><input type="checkbox" name="'+it.id+'" value="'+esc(o)+'" '+((A[it.id]||[]).includes(o)?"checked":"")+'><span>'+esc(o)+"</span></label>").join("")+"</div>";
if(it.type=="scale"||it.type=="scale10"){const n=it.type=="scale"?5:10;let b="";for(let i=1;i<=n;i++)b+='<label class="opt"><input type="radio" name="'+it.id+'" value="'+i+'" '+(A[it.id]==i?"checked":"")+'><span>'+i+"</span></label>";h+='<div class="scale">'+b+"</div>";if(it.lab)h+='<div class="small" style="display:flex;justify-content:space-between;margin-top:6px"><span>1 = '+it.lab[0]+"</span><span>5 = "+it.lab[1]+"</span></div>"}
if(it.type=="price")h+='<div class="price"><input type="number" inputmode="decimal" min="0" step="0.05" name="'+it.id+'" value="'+(A[it.id]||"")+'"></div>';
if(it.type=="text")h+='<textarea rows="3" maxlength="500" name="'+it.id+'">'+esc(A[it.id]||"")+"</textarea>";
if(it.type=="email")h+='<input type="email" name="'+it.id+'" value="'+esc(A[it.id]||"")+'" placeholder="prenom@exemple.fr" autocomplete="email">';
if(it.type=="consent")h+='<label class="chk"><input type="checkbox" name="'+it.id+'" '+(A[it.id]?"checked":"")+"><span>"+esc(it.text)+"</span></label>";
return h}
function show(){const p=Q[s];let h='<div class="card"><h1>'+esc(p.t)+"</h1>";
if(p.bottles)h+='<div class="bottles">'+BOTTLES.map(b=>'<img alt="Bouteille Ourah" src="data:image/jpeg;base64,'+b+'">').join("")+"</div>";
if(p.intro)h+='<div class="note">'+esc(p.intro)+"</div>";
if(p.final){h+='<p id="fin">Envoi en cours…</p>'}else h+=p.items.map(r).join("");if(p.info)h+=INFO;h+="</div>";f.innerHTML=h;
document.getElementById("steplabel").textContent=p.final?"Terminé":"Étape "+(s+1)+" sur "+(Q.length-1);
document.getElementById("prog").style.width=(s/(Q.length-1)*100)+"%";
document.getElementById("prev").style.visibility=(s==0||p.final)?"hidden":"visible";
document.getElementById("next").style.display=p.final?"none":"";
document.getElementById("next").textContent=s==0?"Commencer →":(s==Q.length-2?"Envoyer ✓":"Suivant →");
document.getElementById("err").textContent="";window.scrollTo({top:0,behavior:"smooth"})}
function save(){Q[s].items.forEach(it=>{const els=f.querySelectorAll('[name="'+it.id+'"]');if(!els.length)return;if(it.type=="check")A[it.id]=[...els].filter(x=>x.checked).map(x=>x.value);else if(it.type=="consent")A[it.id]=els[0].checked;else if(it.type=="radio"||it.type=="scale"||it.type=="scale10"){const c=[...els].find(x=>x.checked);if(c)A[it.id]=c.value;else delete A[it.id]}else A[it.id]=els[0].value.trim()})}
function valid(){const p=Q[s];for(const it of p.items){if(it.max&&(A[it.id]||[]).length>it.max)return "Choisissez "+it.max+" réponses maximum.";if(!it.req)continue;const v=A[it.id];if(!v||(Array.isArray(v)&&!v.length))return it.id=="majeur"?"Ce questionnaire est réservé aux personnes majeures.":"Merci de répondre à toutes les questions de cette page."}
if(p.items.some(i=>i.id.endsWith("_p1"))){const k=p.items[0].id.split("_")[0];const v=[1,2,3,4].map(i=>parseFloat(A[k+"_p"+i]));if(v.some(x=>isNaN(x)||x<0))return "Merci de saisir quatre prix valides.";if(!(v[0]<=v[1]&&v[1]<=v[2]&&v[2]<=v[3]))return "Les prix doivent aller du plus bas au plus élevé."}
if(p.items.some(i=>i.id=="email")){if(A.email&&!/^\S+@\S+\.\S+$/.test(A.email))return "L’adresse e-mail semble incorrecte.";if(A.email&&!A.consent)return "Cochez la case de consentement pour que nous puissions utiliser votre e-mail, ou laissez ce champ vide."}return ""}
async function post(url,obj){await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(obj)})}
async function submit(){const rep={...A};delete rep.email;delete rep.consent;delete rep.majeur;rep.version="en_ligne";const email=(A.email&&A.consent)?A.email:"";
const el=()=>document.getElementById("fin");
try{if(!CONFIG.ENDPOINT_REPONSES)throw new Error("config");await post(CONFIG.ENDPOINT_REPONSES,rep);if(email){if(!CONFIG.ENDPOINT_EMAILS)throw new Error("config");await post(CONFIG.ENDPOINT_EMAILS,{email:email})}
el().innerHTML="Vos réponses ont bien été envoyées. Merci pour votre temps : votre avis aide Ourah à choisir les bonnes recettes."+(email?" Nous vous écrirons uniquement pour annoncer le lancement.":"")}
catch(e){el().innerHTML="Version de test : la collecte en ligne n’est pas encore connectée, vos réponses n’ont pas été envoyées."}}
document.getElementById("next").onclick=()=>{save();const e=valid();if(e){document.getElementById("err").textContent=e;return}s++;show();if(Q[s].final)submit()};
document.getElementById("prev").onclick=()=>{save();s--;show()};
show();
</script></body></html>
